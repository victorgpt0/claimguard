# Synthetic claims catalogue: the ICD-11 diagnoses the dataset generator draws from, each
# tied to the SHA benefit package and tariff that would pay for it (Section 3.2.1).
#
# Tariff source: Legal Notice No. 56 of 2025, "Tariffs for Healthcare Services" under the
# Social Health Insurance Act, 2023 (Kenya Subsidiary Legislation, 2025, pp. 477-516).
# Surgical tariffs cite their Annex 3 row number; the gazette text was OCR'd, so every row
# used here was checked against the scanned page. LN 78 of 2026 later amended the Level 2-3
# maternity provisions; the KES 10,000 / 30,000 delivery amounts used below are unchanged.
#
# ICD-11 codes and titles: verified against the WHO ICD-11 API, MMS release 2026-01 (local
# whoicd/icd-api container). Stem codes only: the classifier looks up one code per claim, so
# post-coordinated clusters (e.g. DD51/ME24.2) are not used.
#
# Payment mechanisms in LN 56/2025:
#   capitation    - Primary Healthcare Fund outpatient care (KES 900 per person per annum,
#                   Levels 2-3 and select Level 4). Visits are reported, not billed per
#                   claim, so claim_amount is 0.
#   per_diem      - SHIF Medical Inpatient Services, Levels 3-6, a daily rate by facility
#                   level; claim_amount = rate x length of stay.
#   case_rate     - a fixed amount per case: maternity packages and the Annex 3 surgical
#                   schedule.
#
# Field reference:
#   weight         relative frequency in the base (clean) claims
#   levels         facility levels (KEPH 2-6) allowed to provide this service
#   los            [min, max] length of stay in days; outpatient visits are 0
#   age            [min, max] patient age in years
#   sex            any | female | male
#   outpatient_only  true when the condition is normally managed without admission; these
#                  are the eligible pool for the outpatient-to-inpatient conversion typology
#                  (Table 3.1 row 2)
#   upcode_to      higher-tariff codes this claim may be upcoded to (Table 3.1 row 1). The
#                  clinical notes keep describing the original code.

per_diem_rates_kes:          # LN 56/2025, SHIF Medical Inpatient Services
  3: 2240
  4: 3360
  5: 3920
  6: 4480

