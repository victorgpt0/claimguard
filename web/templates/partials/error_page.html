{% load lucide %}
{# Shared body of the 403, 404 and 500 pages: what happened, and a way back. #}
<section class="card mx-auto mt-6 max-w-xl">
  <div class="empty-state">
    <span class="kpi-icon size-12 {{ tone }}">{% lucide icon size=22 %}</span>
    <p class="m-0 text-xs font-medium tracking-wider text-muted uppercase">Error {{ code }}</p>
    <h1 class="mb-0 justify-center">{{ title }}</h1>
    <p>{{ message }}</p>
    <div class="flex flex-wrap justify-center gap-2">
      <a class="btn-primary" href="{% url 'home' %}">{% lucide "house" size=16 %} Go to the overview</a>
      <button type="button" class="btn" onclick="history.back()">{% lucide "arrow-left" size=16 %} Go back</button>
    </div>
  </div>
</section>
