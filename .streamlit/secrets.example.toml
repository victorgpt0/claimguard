# Copy to .streamlit/secrets.toml (gitignored, never commit it) to enable "Sign in with
# Google" (#61). Without secrets.toml the dashboard offers password sign-in only.
#
# Google Cloud Console -> APIs & Services -> Credentials -> Create OAuth client ID,
# type "Web application", authorised redirect URI exactly as redirect_uri below.
# A Google account can then sign in only once it is linked to a ClaimGuard user:
#   python -m src.db.seed --db-path <db> --link-email <username> <email>

[auth]
redirect_uri = "http://localhost:8501/oauth2callback"
# A long random string: python -c "import secrets; print(secrets.token_hex(32))"
cookie_secret = "replace-with-a-long-random-string"

[auth.google]
client_id = "replace-me.apps.googleusercontent.com"
client_secret = "replace-me"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"
