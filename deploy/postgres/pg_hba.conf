# Who may connect to PostgreSQL (deploy/compose.yaml).
# TYPE     DATABASE  USER  ADDRESS         METHOD
# Inside the container (the image's init scripts, psql via docker compose exec).
local      all       all                   trust
# The network's gateway is not a container: connections Docker's proxy relays from outside
# (IPv6, or from the host itself) arrive from it. They get the outside rule: TLS or nothing.
hostnossl  all       all   172.30.0.1/32   reject
# The stack's own containers, on the compose network only.
host       all       all   172.30.0.0/24   scram-sha-256
# Everyone else (the Colab GPU worker): TLS and a password, or nothing.
hostssl    all       all   0.0.0.0/0       scram-sha-256
hostssl    all       all   ::/0            scram-sha-256
