# Copy this file to config.yaml and fill in real values. config.yaml is gitignored — never
# commit it. Threshold values below are placeholders until validation-split tuning (Section
# 3.2.3) produces real numbers; FR-10 reads this file at startup, not a live dashboard control.

paths:
  data_dir: /content/drive/MyDrive/SHA_Fraud_Audit/data
  model_dir: /content/drive/MyDrive/SHA_Fraud_Audit/models
  artifacts_dir: /content/drive/MyDrive/SHA_Fraud_Audit/artifacts
  experiments_dir: /content/drive/MyDrive/SHA_Fraud_Audit/experiments
  db_path: /content/drive/MyDrive/SHA_Fraud_Audit/db/sha_fraud.sqlite

thresholds:
  # Isolation Forest / Autoencoder anomaly score threshold (FR-02). Not yet tuned.
  anomaly_score_threshold: null
  # Semantic Consistency Classifier decision threshold (FR-04). Not yet tuned.
  classifier_decision_threshold: null
  # FR-13: number of new Feedback Dataset examples that triggers a retraining job.
  # Provisional per chapter4_system_analysis_design.txt FR-13 — not yet validated.
  retrain_trigger_count: 50

models:
  # AfroXLM-R primary choice, XLM-RoBERTa-base fallback (Section 3.8.6 / 1.7 compute constraint)
  classifier_base_model: Davlan/afro-xlmr-base
  classifier_base_model_fallback: xlm-roberta-base
  # LLM provider for the explanation-only narrative layer (Section 3.8.7). Pick one.
  llm_provider: huggingface  # or: openai
  llm_model_name: null       # set once a specific open-weight model is selected (Gershon et al., 2025 benchmark)

apis:
  # Self-hosted WHO ICD-11 API (whoicd/icd-api Docker image — see docker-compose.yml),
  # not the cloud API at icd.who.int. No OAuth2 credentials needed for a local
  # deployment — that's only required against WHO's cloud-hosted instance. Port must
  # match docker-compose.yml's host-side mapping.
  icd11_api_base_url: http://localhost:8081

training:
  # Section 3.2.4 dataset split (Table 3.1 / dataset-size justification)
  train_split: 0.6
  val_split: 0.2
  test_split: 0.2
  # Block K: 5 seeds for classifier fine-tuning, mean±std reporting
  random_seeds: [42, 123, 2024, 7, 31415]
